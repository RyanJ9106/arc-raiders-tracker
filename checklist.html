<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Raid Checklist – ARC Raiders Tracker</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <h1>Raid Checklist <span class="badge">printable • grouped • priority-first</span></h1>
      <nav class="noPrint">
        <a class="navlink" href="index.html">Home</a>
        <a class="navlink" href="materials.html">Materials</a>
        <a class="navlink" href="recipes.html">Recipes</a>
        <a class="navlink" href="checklist.html">Raid Checklist</a>
      </nav>
    </div>
  </div>
</header>

<main>
  <div class="grid" style="grid-template-columns: 1fr;">
    <section class="card">
      <div class="hd">
        <h2>Summary</h2>
        <div class="noPrint" style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="tiny" id="exportTextBtn">Export .txt</button>
          <button class="tiny primary" id="printBtn">Print</button>
        </div>
      </div>
      <div class="bd">
        <div class="kpi">
          <div class="pill">
            <div class="t">Missing items</div>
            <div class="v ok" id="missingCount">0</div>
          </div>
          <div class="pill">
            <div class="t">Total missing quantity</div>
            <div class="v ac" id="missingTotal">0</div>
          </div>
          <div class="pill">
            <div class="t">How to use</div>
            <div class="muted" style="margin-top:6px">Update “Have” in Materials after raids. This list updates automatically.</div>
          </div>
        </div>
      </div>
    </section>

    <div id="checklistWrap"></div>

    <section class="card printOnly">
      <div class="hd"><h2>Notes</h2></div>
      <div class="bd">
        <div style="height:140px;border:1px dashed rgba(33,48,67,.7);border-radius:14px"></div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast">Saved</div>
<script src="assets/app.js"></script>
<script>window.ARCT.initChecklist();</script>
</body>
</html>
