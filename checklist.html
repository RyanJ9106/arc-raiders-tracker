<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Raid Checklist – ARC Raiders</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<header>
  <div class="wrap">
    <div class="topbar">
      <h1>
        Raid Checklist
        <span class="badge"></span>
      </h1>

      <nav class="noPrint">
        <a class="navlink" href="index.html">Home</a>
        <a class="navlink" href="materials.html">Materials</a>
        <a class="navlink" href="recipes.html">Recipes</a>
        <a class="navlink" href="locations.html">Locations</a>
        <a class="navlink" href="checklist.html">Raid Checklist</a>
      </nav>

      <div class="noPrint" style="display:flex;gap:10px;align-items:center">
        <span class="badge" id="lastSaved">Last saved: —</span>
        <button class="tiny" id="saveNowBtn" type="button">Save now</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="grid" style="grid-template-columns:1fr">

    <section class="card">
      <div class="hd">
        <h2>Summary</h2>

        <div class="noPrint" style="display:flex;gap:10px;align-items:center">
          <select id="checkView">
            <option value="category" selected>Group by Category</option>
            <option value="locations">Group by Locations</option>
          </select>
          <button class="tiny" id="exportTextBtn">Export .txt</button>
          <button class="tiny primary" id="printBtn">Print</button>
        </div>
      </div>

      <div class="bd">
        <div class="kpi">
          <div class="pill">
            <div class="t">Missing items</div>
            <div class="v ok" id="missingCount">0</div>
          </div>
          <div class="pill">
            <div class="t">Total missing</div>
            <div class="v ac" id="missingTotal">0</div>
          </div>
        </div>
      </div>
    </section>

    <div id="checklistWrap"></div>

  </div>
</main>

<div class="toast" id="toast">Saved</div>
<script src="assets/app.js"></script>
<script>ARCT.initChecklist();</script>
</body>
</html>
