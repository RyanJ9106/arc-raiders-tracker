<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ARC Raiders – Tracker</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<header>
  <div class="wrap">
    <div class="topbar">
      <h1>
        ARC Raiders – Tracker
        <span class="badge"></span>
      </h1>

      <nav class="noPrint">
        <a class="navlink" href="index.html">Home</a>
        <a class="navlink" href="materials.html">Materials</a>
        <a class="navlink" href="recipes.html">Recipes</a>
        <a class="navlink" href="locations.html">Locations</a>
        <a class="navlink" href="checklist.html">Raid Checklist</a>
      </nav>

      <div class="noPrint" style="display:flex;gap:10px;align-items:center">
        <span class="badge" id="lastSaved">Last saved: —</span>
        <button class="tiny" id="saveNowBtn" type="button">Save now</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="grid">
    <section class="card">
      <div class="hd"><h2>Dashboard</h2></div>
      <div class="bd">

        <div class="kpi">
          <div class="pill">
            <div class="t">Materials</div>
            <div class="v ok" id="homeMatCount">0</div>
          </div>
          <div class="pill">
            <div class="t">Recipes</div>
            <div class="v ok" id="homeRecCount">0</div>
          </div>
          <div class="pill">
            <div class="t">Locations</div>
            <div class="v ok" id="homeLocCount">0</div>
          </div>
        </div>

        <div class="sep"></div>

        <div class="kpi">
          <div class="pill">
            <div class="t">Have</div>
            <div class="v ok" id="homeHave">0</div>
          </div>
          <div class="pill">
            <div class="t">Needed</div>
            <div class="v wn" id="homeNeed">0</div>
          </div>
          <div class="pill">
            <div class="t">Missing</div>
            <div class="v ac" id="homeMissing">0</div>
          </div>
        </div>

        <div class="sep"></div>

        <div class="inline" style="justify-content:space-between">
          <div class="muted">Overall progress</div>
          <div class="muted" id="homeProgPct">0%</div>
        </div>
        <div class="bar" id="homeProgBar"><div></div></div>

      </div>
    </section>

    <section class="card">
      <div class="hd"><h2>Top Missing Materials</h2></div>
      <div class="bd">
        <div id="homeTopMissing"></div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast">Saved</div>

<script src="assets/app.js"></script>
<script>ARCT.initHome();</script>
</body>
</html>
